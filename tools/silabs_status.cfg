# Read-only Silicon Labs Series 2 debug-lock diagnosis via the Flipper.
# Run from the repository root: openocd -f tools/silabs_status.cfg
# Protocol: Silicon Labs AN1303, DCI and SE Command List.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x0483 0x5740
cmsis_dap_backend usb_bulk
cmsis_dap_usb interface 1
adapter serial DAP_Ngxson
transport select swd
adapter speed 100
swd newdap silabs cpu -expected-id 0x6ba02477
dap create silabs.dap -chain-position silabs.cpu
target create silabs.dci mem_ap -dap silabs.dap -ap-num 1
gdb_port disabled
tcl_port disabled
telnet_port disabled

proc dci_wait {mask expected} {
    for {set retry 0} {$retry < 100} {incr retry} {
        set status [lindex [read_memory 0x1008 32 1] 0]
        if {($status & $mask) == $expected} { return $status }
        sleep 10
    }
    error "DCI status timeout"
}

proc dci_read_status {command} {
    # Only allow Get Status and Read Lock Status, never erase or unlock.
    if {$command != 0xFE010000 && $command != 0x43110000} {
        error "Unsupported status command"
    }
    foreach word [list 8 $command] {
        set status [dci_wait 1 0]
        if {$status & 0x100} { error "Unread DCI response; refusing new command" }
        mww 0x1000 $word
    }
    dci_wait 0x100 0x100
    set header [lindex [read_memory 0x1004 32 1] 0]
    set length [expr {$header & 0xffff}]
    if {$length < 4 || $length > 256 || ($length % 4) != 0} {
        error "Invalid DCI response length"
    }
    set response {}
    for {set offset 4} {$offset < $length} {incr offset 4} {
        dci_wait 0x100 0x100
        lappend response [lindex [read_memory 0x1004 32 1] 0]
    }
    if {$header >> 16} { error [format "DCI response error 0x%08x" $header] }
    echo [format "Command 0x%08x, response %d bytes:" $command $length]
    foreach word $response { echo [format "  0x%08x" $word] }
    return $response
}

init
if {[catch {
    dci_read_status 0xFE010000
    set lock [lindex [dci_read_status 0x43110000] 0]
    echo [format "Debug lock configured: %d; hardware locked: %d; secure debug: %d; device erase enabled: %d" \
        [expr {($lock & 1) != 0}] [expr {($lock & 0x20) != 0}] \
        [expr {($lock & 4) != 0}] [expr {($lock & 2) != 0}]]
} problem]} {
    echo $problem
    shutdown error
} else {
    shutdown
}
